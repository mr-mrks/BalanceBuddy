<!DOCTYPE html>
<html>
<head>
    <title>BalanceBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
    font-family: 'Roboto', sans-serif; /* Use Roboto font */
    margin: 16px;
    background-color: #f8f9fa; /* Soft background color */
    color: #333;
    line-height: 1.6;
}

h1, h2 {
    margin-bottom: 16px;
    color: #212529;
}

form {
    background-color: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 20px;
    width: calc(33% - 20px); /* Adjust width for responsive layout */
    display: inline-block;
    vertical-align: top;
    box-sizing: border-box;
    margin-right: 15px; /* Add margin between forms */
}

label {
    display: block;
    margin-bottom: 8px;
    color: #495057;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border: 1px solid #ced4da;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 1rem;
}

button {
    background-color: #007bff; /* Primary button color */
    color: #fff;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

button:hover {
    background-color: #0056b3;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    overflow: hidden;
}

th, td {
    border-bottom: 1px solid #dee2e6;
    padding: 12px 15px;
    text-align: left;
}

th {
    background-color: #e0f7fa; /* Light blue shade for header */
}

tfoot th {
    background-color: #e0f7fa; /* Light blue shade for total row */
}

#balanceChart {
    margin-bottom: 20px;
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 20px;
}

/* Responsive Design */
@media (max-width: 768px) {
    form {
        width: 100%; /* Full width on smaller screens */
        margin-right: 0; /* Remove right margin on smaller screens */
    }
}
    </style>
</head>
<body>
    <h1>BalanceBuddy</h1>

    <h2>Account Balance Chart</h2>
    <canvas id="balanceChart" width="400" height="200"></canvas>

    <div id="current-balances"></div>

    <h2>Forms</h2>
    <form id="add-account-form" action="api/add_account.php" method="POST">
        <label for="new-account-name">Account Name:</label>
        <input type="text" id="new-account-name" name="name"><br>
        <button type="submit" id="add-account-button">Add Account</button>
    </form>

    <form id="add-balance-form" action="api/add_balance.php" method="POST">
        <label for="account-select">Account:</label>
        <select id="account-select" name="account_id"></select><br>

        <label for="balance-date">Date:</label>
        <input type="date" id="balance-date" name="entry_date"><br>

        <label for="balance-amount">Amount:</label>
        <input type="number" id="balance-amount" name="balance"><br>

        <button type="submit" id="add-balance-button">Add Balance</button>
    </form>

    <form id="update-balance-form" action="api/update_balance.php" method="POST">
        <label for="update-account-select">Account:</label>
        <select id="update-account-select" name="account_id"></select><br>

        <label for="update-balance-select">Balance Entry:</label>
        <select id="update-balance-select" name="balanceid"></select><br>

        <label for="update-balance-date">Date:</label>
        <input type="date" id="update-balance-date" name="entry_date"><br>

        <label for="update-balance-amount">Amount:</label>
        <input type="number" id="update-balance-amount" name="balance"><br>

        <button type="submit" id="update-balance-button">Update Balance</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
