<!DOCTYPE html>
<html>
<head>
    <title>BalanceBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ... (CSS styles from previous response) ... */
        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-toggle {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>BalanceBuddy</h1>

    <h2>Account Balance Chart</h2>
    <div>
        <label for="start-date">Start Date:</label>
        <input type="date" id="start-date">
        <label for="end-date">End Date:</label>
        <input type="date" id="end-date">
        <button id="update-chart-button">Update Chart</button>
    </div>
    <canvas id="balanceChart" width="400" height="200"></canvas>

    <div id="current-balances"></div>

    <h2>Forms</h2>
    <div class="form-toggle">
        <button id="show-add-account">Add Account</button>
        <button id="show-add-balance">Add Balance</button>
        <button id="show-update-balance">Update Balance</button>
    </div>

    <div id="add-account-form" class="form-container">
        <form action="api/add_account.php" method="POST">
            <label for="new-account-name">Account Name:</label>
            <input type="text" name="name"><br>
            <button type="submit">Add Account</button>
        </form>
    </div>

    <div id="add-balance-form" class="form-container active">
        <form action="api/add_balance.php" method="POST">
            <label for="account-select">Account:</label>
            <select id="account-select" name="account_id"></select><br>
            <label for="balance-date">Date:</label>
            <input type="date" id="balance-date" name="entry_date"><br>
            <label for="balance-amount">Amount:</label>
            <input type="number" name="balance"><br>
            <button type="submit">Add Balance</button>
        </form>
    </div>

    <div id="update-balance-form" class="form-container">
        <form action="api/update_balance.php" method="POST">
            <label for="update-account-select">Account:</label>
            <select id="update-account-select" name="account_id"></select><br>
            <label for="update-balance-select">Balance Entry:</label>
            <select id="update-balance-select" name="balanceid"></select><br>
            <label for="update-balance-date">Date:</label>
            <input type="date" id="update-balance-date" name="entry_date"><br>
            <label for="update-balance-amount">Amount:</label>
            <input type="number" name="balance"><br>
            <button type="submit">Update Balance</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
